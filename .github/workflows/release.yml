name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository_owner }}/aureoncare

jobs:
  # ── Job 1: Build and Push Docker Images ────────────────────────────────────
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      # ── Backend Image ───────────────────────────────────────────────────────
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-backend:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-backend:latest
          labels: |
            org.opencontainers.image.title=AureonCare Backend
            org.opencontainers.image.description=AureonCare Healthcare Practice Management - Backend API
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend Image ──────────────────────────────────────────────────────
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-frontend:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-frontend:latest
          labels: |
            org.opencontainers.image.title=AureonCare Frontend
            org.opencontainers.image.description=AureonCare Healthcare Practice Management - Frontend
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Update Agent Image ──────────────────────────────────────────────────
      - name: Build and push update-agent image
        uses: docker/build-push-action@v5
        with:
          context: update-agent
          file: update-agent/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-update-agent:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-update-agent:latest
          labels: |
            org.opencontainers.image.title=AureonCare Update Agent
            org.opencontainers.image.description=AureonCare On-Premises Update Agent
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 2: Package Helm Chart ───────────────────────────────────────────────
  package-helm:
    name: Package Helm Chart
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.0"

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Update chart version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.version }}/" helm/aureoncare/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.version }}\"/" helm/aureoncare/Chart.yaml

      - name: Package Helm chart
        run: helm package helm/aureoncare/ --destination /tmp/helm-packages/

      - name: Upload Helm chart as release artifact
        uses: softprops/action-gh-release@v1
        with:
          files: /tmp/helm-packages/aureoncare-*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 3: Create On-Premises Bundle ───────────────────────────────────────
  create-onprem-bundle:
    name: Create On-Premises Bundle
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create on-premises bundle
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUNDLE_NAME="aureoncare-onprem-${VERSION}"
          BUNDLE_DIR="/tmp/${BUNDLE_NAME}"

          mkdir -p "${BUNDLE_DIR}/docker/backend"
          mkdir -p "${BUNDLE_DIR}/docker/frontend"
          mkdir -p "${BUNDLE_DIR}/docker/nginx"
          mkdir -p "${BUNDLE_DIR}/update-agent"
          mkdir -p "${BUNDLE_DIR}/deployment/onprem"

          # Copy required files
          cp docker-compose.yml "${BUNDLE_DIR}/"
          cp docker/backend/Dockerfile "${BUNDLE_DIR}/docker/backend/"
          cp docker/frontend/Dockerfile "${BUNDLE_DIR}/docker/frontend/"
          cp docker/nginx/nginx.conf "${BUNDLE_DIR}/docker/nginx/"
          cp update-agent/agent.js "${BUNDLE_DIR}/update-agent/"
          cp update-agent/package.json "${BUNDLE_DIR}/update-agent/"
          cp update-agent/Dockerfile "${BUNDLE_DIR}/update-agent/"
          cp backend/.env.example "${BUNDLE_DIR}/backend.env.example"
          cp frontend/.env.example "${BUNDLE_DIR}/frontend.env.example"
          cp deployment/onprem/install.sh "${BUNDLE_DIR}/"

          # Embed version
          echo "${VERSION}" > "${BUNDLE_DIR}/VERSION"

          # Create tarball
          tar -czf "/tmp/${BUNDLE_NAME}.tar.gz" -C /tmp "${BUNDLE_NAME}"
          echo "Created bundle: /tmp/${BUNDLE_NAME}.tar.gz"

      - name: Upload on-premises bundle as release artifact
        uses: softprops/action-gh-release@v1
        with:
          files: /tmp/aureoncare-onprem-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
