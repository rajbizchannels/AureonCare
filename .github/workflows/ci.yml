name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
      - "claude/**"

jobs:
  # ── Job 1: Lint and Test ────────────────────────────────────────────────────
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      # Backend
      - name: Install backend dependencies
        working-directory: .
        run: npm ci --ignore-scripts

      - name: Run backend tests
        working-directory: .
        run: npm test --if-present
        env:
          NODE_ENV: test
          CI: true

      # Frontend
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Run frontend tests
        working-directory: frontend
        run: npm test --if-present -- --watchAll=false --passWithNoTests
        env:
          CI: true

  # ── Job 2: Docker Build Verification ───────────────────────────────────────
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (verify only, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend/Dockerfile
          push: false
          tags: aureoncare-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (verify only, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: false
          tags: aureoncare-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build update-agent image (verify only, no push)
        uses: docker/build-push-action@v5
        with:
          context: update-agent
          file: update-agent/Dockerfile
          push: false
          tags: aureoncare-update-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Helm Lint ────────────────────────────────────────────────────────
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.0"

      - name: Lint Helm chart
        run: helm lint helm/aureoncare/

      - name: Lint with SaaS values
        run: helm lint helm/aureoncare/ -f helm/aureoncare/values.saas.yaml

      - name: Lint with customer-cloud values
        run: helm lint helm/aureoncare/ -f helm/aureoncare/values.customer-cloud.yaml

      - name: Lint with on-prem values
        run: helm lint helm/aureoncare/ -f helm/aureoncare/values.onprem.yaml

      - name: Render templates (dry-run)
        run: |
          helm template aureoncare helm/aureoncare/ \
            --set env.AC_TK_S=dummy-secret \
            --set env.AC_EK=dummy-encryption-key \
            --set postgresql.auth.password=dummy-password \
            > /tmp/rendered.yaml
          echo "Template rendering succeeded"
