###############################################################################
# AureonCare Kubernetes Secret
#
# IMPORTANT: In production environments, these values should be injected
# from an external secrets manager rather than stored in values.yaml.
# Recommended solutions:
#   - AWS Secrets Manager via External Secrets Operator
#   - HashiCorp Vault Agent Injector
#   - Azure Key Vault via Azure Key Vault Provider for Secrets Store CSI
#   - GCP Secret Manager via External Secrets Operator
#
# Never commit actual secret values to version control.
###############################################################################
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aureoncare.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aureoncare.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # ── JWT Signing Secret (REQUIRED) ─────────────────────────────────────────
  # Minimum 32 random characters. Generate: openssl rand -hex 32
  AC_TK_S: {{ .Values.env.AC_TK_S | b64enc | quote }}

  # ── Field-Level Encryption Key (REQUIRED) ─────────────────────────────────
  # Exactly 32 random characters. Generate: openssl rand -hex 16
  AC_EK: {{ .Values.env.AC_EK | b64enc | quote }}

  # ── Database Credentials (REQUIRED — choose one approach) ─────────────────
  # Option A: Full PostgreSQL connection URI (takes precedence over AC_DB_* vars)
  AC_PG_URI: {{ .Values.env.AC_PG_URI | b64enc | quote }}
  # Option B: Password for individual AC_DB_* connection vars
  AC_DB_W: {{ .Values.env.AC_DB_W | b64enc | quote }}

  {{- if .Values.postgresql.enabled }}
  # When using the in-cluster PostgreSQL subchart, inject its password here
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | b64enc | quote }}
  {{- end }}

  {{- if and .Values.redis.enabled .Values.redis.auth.enabled }}
  # Redis authentication password
  AC_RD_W: {{ .Values.redis.auth.password | b64enc | quote }}
  {{- end }}

  # ── Email (optional) ──────────────────────────────────────────────────────
  AC_SG_KEY: {{ .Values.env.AC_SG_KEY | b64enc | quote }}

  # ── Video Conferencing Integrations (optional) ────────────────────────────
  AC_ZM_CID: {{ .Values.env.AC_ZM_CID | b64enc | quote }}
  AC_ZM_CSK: {{ .Values.env.AC_ZM_CSK | b64enc | quote }}
  AC_GM_CID: {{ .Values.env.AC_GM_CID | b64enc | quote }}
  AC_GM_CSK: {{ .Values.env.AC_GM_CSK | b64enc | quote }}
  AC_MS_CID: {{ .Values.env.AC_MS_CID | b64enc | quote }}
  AC_MS_CSK: {{ .Values.env.AC_MS_CSK | b64enc | quote }}
  AC_WBX_CID: {{ .Values.env.AC_WBX_CID | b64enc | quote }}
  AC_WBX_CSK: {{ .Values.env.AC_WBX_CSK | b64enc | quote }}

  # ── Cloud Storage Integrations (optional) ─────────────────────────────────
  AC_GD_CSK: {{ .Values.env.AC_GD_CSK | b64enc | quote }}
  AC_OD_CSK: {{ .Values.env.AC_OD_CSK | b64enc | quote }}

  # ── Supabase (optional — only when using Supabase as backend) ─────────────
  AC_SB_SK: {{ .Values.env.AC_SB_SK | b64enc | quote }}

  # ── Update Agent Subscription Key ─────────────────────────────────────────
  SUBSCRIPTION_KEY: {{ .Values.env.SUBSCRIPTION_KEY | b64enc | quote }}
