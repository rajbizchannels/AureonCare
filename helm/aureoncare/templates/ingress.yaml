{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aureoncare.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aureoncare.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecret | default (printf "%s-tls" (include "aureoncare.fullname" .)) }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # ── API routes → backend ──────────────────────────────────────────
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: {{ include "aureoncare.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.port }}
          # ── Health check → backend ────────────────────────────────────────
          - path: /health
            pathType: Exact
            backend:
              service:
                name: {{ include "aureoncare.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.port }}
          # ── File uploads → backend ────────────────────────────────────────
          - path: /uploads/
            pathType: Prefix
            backend:
              service:
                name: {{ include "aureoncare.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.port }}
          # ── Everything else → frontend (React SPA) ────────────────────────
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "aureoncare.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.port }}
{{- end }}
