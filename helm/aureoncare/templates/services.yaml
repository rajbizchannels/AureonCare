###############################################################################
# AureonCare Services
# Backend: ClusterIP on port 3000 — only accessible within the cluster
# Frontend: ClusterIP on port 80  — exposed externally via Ingress
###############################################################################

# ── Backend Service ──────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aureoncare.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aureoncare.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "aureoncare.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
      protocol: TCP

---
# ── Frontend Service ─────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aureoncare.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aureoncare.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    {{- include "aureoncare.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
      protocol: TCP
